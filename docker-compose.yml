
services:
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile
    image: olist-mlops:local
    container_name: olist-mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_db:/mlflow
      - mlflow_artifacts:/mlartifacts
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - /mlartifacts
      - --serve-artifacts
      - --allowed-hosts
      - "mlflow:5000,mlflow,localhost:5000,localhost,127.0.0.1:5000,127.0.0.1,olist-mlflow:5000,olist-mlflow"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  mlflow-init:
    build:
      context: .
      dockerfile: Dockerfile
    image: olist-mlops:local
    container_name: olist-mlflow-init
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    command:
      - python
      - src/mlflow_tracking.py
    volumes:
      - "./olist db:/app/olist db:ro"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: olist-mlops:local
    container_name: olist-api
    depends_on:
      mlflow-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_MODEL_URI: models:/olist_late_delivery_model@Production
    volumes:
      - "./olist db:/app/olist db:ro"
      - api_logs:/app/logs
      - "./app:/app/app:ro"
      - "./src:/app/src:ro"
      - "./config:/app/config:ro"
    restart: unless-stopped

volumes:
  mlflow_db:
  mlflow_artifacts:
  api_logs:
